<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>YiW</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #121815;
      }

      .app-boot {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        color: #f4efe3;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        -webkit-app-region: drag;
      }

      .app-boot__mark {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .app-boot__mark span {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #ffd34e;
        opacity: 0.34;
        animation: appBootPulse 1.1s ease-in-out infinite;
      }

      .app-boot__mark span:nth-child(2) {
        animation-delay: 0.14s;
      }

      .app-boot__mark span:nth-child(3) {
        animation-delay: 0.28s;
      }

      @keyframes appBootPulse {
        0%,
        100% {
          opacity: 0.34;
          transform: translateY(0);
        }
        45% {
          opacity: 1;
          transform: translateY(-5px);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-boot" aria-label="YiW 正在启动">
        <div class="app-boot__mark" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
