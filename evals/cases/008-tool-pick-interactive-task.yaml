id: 008-tool-pick-interactive-task
category: tool-selection
rule: R8
description: |
  Tasks that require interaction (login, click, type, fill form,
  multi-step flow) cannot be done with read-only `browser_fetch`. The
  agent must call `browser_enable` to trigger Playwright install. If
  the agent instead refuses ("I can't log in") or stalls on
  browser_fetch, that's the failure mode this rule guards against.

mode: fixture

user_message: "帮我登录 GitHub，然后给 PR vibeinging/YiYi#1 留个 'LGTM' 评论。"

mock_tool_results:
  browser_enable: |
    User confirmed Playwright install; browser tools (browser_navigate / click / type / snapshot / etc.) are now available. Retry your original action using those tools.

fixture:
  - role: assistant
    content: "这需要交互式浏览器，先启用一下。"
    tool_calls:
      - name: browser_enable
        arguments: { reason: "GitHub login + comment requires interactive browser" }

expect:
  must_call_tool:
    - name: browser_enable
  must_not_call_tool:
    - name: browser_fetch

  must_not_say:
    - "无法登录"
    - "无法操作浏览器"
    - "我没有这个能力"

  rubric:
    - criterion: >
        Agent called browser_enable to request the interactive browser
        capability.
      weight: critical
    - criterion: >
        Agent did NOT settle for browser_fetch — that's read-only and
        cannot click / type / submit.
      weight: high
    - criterion: >
        Agent did NOT bail out with a "我做不了" message when in fact
        browser_enable is the documented escape hatch for this case.
      weight: critical
