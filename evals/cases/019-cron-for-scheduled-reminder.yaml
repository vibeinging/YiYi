id: 019-cron-for-scheduled-reminder
category: tool-selection
rule: R10
description: |
  Scheduled reminder ("明天早上 9 点提醒我...") → `create_cronjob`.
  Don't try to use shell `at` / `crontab`, don't spawn an agent that
  sleeps until then, don't claim "我会在 9 点叫你" without scheduling.

mode: fixture

user_message: "明天早上 9 点提醒我开站会"

mock_tool_results:
  create_cronjob: |
    Cronjob created: cron_abc123, fires at 2026-05-07 09:00 local time.

fixture:
  - role: assistant
    content: "好，我帮你设个定时提醒。"
    tool_calls:
      - name: create_cronjob
        arguments:
          name: "站会提醒"
          schedule: "0 9 * * *"
          task_type: "notify"
          text: "该开站会了"

expect:
  must_call_tool:
    - name: create_cronjob
  must_not_call_tool:
    - name: execute_shell
    - name: spawn_agents

  rubric:
    - criterion: >
        Agent created a cronjob for the scheduled reminder.
      weight: critical
    - criterion: >
        Agent did NOT claim "我会在 9 点提醒你" without actually
        scheduling — that would be a hollow promise.
      weight: critical
