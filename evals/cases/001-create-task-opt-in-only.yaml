id: 001-create-task-opt-in-only
category: behavior
rule: R1
seed_bug: "2026-04-22 · 用户截图 #1 — agent 对『创建一个介绍大熊猫的PPT』默认用了 create_task"
description: |
  Routine file-producing requests without explicit 『后台』 trigger words MUST
  run inline. Architecturally: the agent may use `inline_task` to render a
  progress card, but MUST NOT call `detach_to_background` (or the legacy
  `create_task`) because the user message contains no background-trigger
  phrase. `detach_to_background` is gated by quote_user_consent which would
  fail validation here anyway.

mode: fixture

user_message: "创建一个介绍大熊猫的PPT，好看，可爱，粉色。"

fixture:
  - role: assistant
    content: "好，我直接来做。"
    tool_calls:
      - name: create_workspace_dir
        arguments: { dir_name: "大熊猫介绍PPT" }

expect:
  # Hard: never detach to a background session for this request — there is
  # no opt-in trigger phrase. inline_task is fine (and recommended) because
  # it renders a progress card without detaching.
  must_not_call_tool:
    - name: detach_to_background
    - name: create_task   # legacy name, kept here as a defensive guard

  rubric:
    # Each criterion describes what the agent SHOULD have done for this
    # case (no opt-in language → inline execution).
    - criterion: >
        EXPECTED: tool_calls contains zero invocations of
        detach_to_background OR the legacy create_task. PASS when both
        names are absent; FAIL when either is present.
      weight: critical
    - criterion: >
        EXPECTED: tool_calls contains at least one of create_workspace_dir,
        run_python_script, write_file, edit_file, or another file-creation
        tool — i.e., the agent did the work inline. PASS when one of those
        is present; FAIL when tool_calls is empty or only contains
        non-creation tools. (`inline_task` for the progress card is also
        acceptable but does not on its own satisfy this criterion — the
        actual file creation must happen.)
      weight: critical
    - criterion: >
        EXPECTED: the final reply text does NOT contain phrases like
        『任务已在后台开始』 or 『已创建后台任务』 (which would
        falsely imply background execution). PASS when those phrases
        are absent; FAIL when they appear.
      weight: critical
