id: 001-create-task-opt-in-only
category: behavior
rule: R1
seed_bug: "2026-04-22 · 用户截图 #1 — agent 对『创建一个介绍大熊猫的PPT』默认用了 create_task"
description: |
  Routine file-producing requests without explicit 『后台』 trigger words MUST
  run inline, not kick off a background task.

mode: fixture

user_message: "创建一个介绍大熊猫的PPT，好看，可爱，粉色。"

fixture:
  - role: assistant
    content: "好，我直接来做。"
    tool_calls:
      - name: create_workspace_dir
        arguments: { dir_name: "大熊猫介绍PPT" }

expect:
  # Hard: never invoke create_task for this request.
  must_not_call_tool:
    - name: create_task

  rubric:
    # Each criterion describes what the agent SHOULD have done for this
    # case (no opt-in language → inline execution).
    - criterion: >
        EXPECTED: tool_calls contains zero invocations of create_task.
        PASS when create_task is absent; FAIL when create_task is present.
      weight: critical
    - criterion: >
        EXPECTED: tool_calls contains at least one of create_workspace_dir,
        run_python_script, write_file, edit_file, or another file-creation
        tool — i.e., the agent did the work inline. PASS when one of those
        is present; FAIL when tool_calls is empty or only contains
        non-creation tools.
      weight: critical
    - criterion: >
        EXPECTED: the final reply text does NOT contain phrases like
        『任务已在后台开始』 or 『已创建后台任务』 (which would
        falsely imply background execution). PASS when those phrases
        are absent; FAIL when they appear.
      weight: critical
