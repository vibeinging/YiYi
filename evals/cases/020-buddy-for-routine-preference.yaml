id: 020-buddy-for-routine-preference
category: tool-selection
rule: R10
description: |
  When the agent needs to make a routine preference call (tech-stack
  pick, code-style choice, "should I use X or Y") and the user isn't
  available / it'd interrupt them, `ask_buddy` is the right escape
  hatch — the buddy knows the user's history and preferences.
  For factual questions ("what's the latest React version?"), don't
  ask buddy — just look it up.

mode: fixture

user_message: |
  我要给这个新的命令行工具选一个 logger 库。我之前有偏好吗？你帮我决定一下。

mock_tool_results:
  ask_buddy: |
    {"answer":"用 tracing — 你过去 3 个 Rust 项目都用它，结构化日志 + tracing-subscriber 是你的默认组合。","confidence":0.92,"needs_review":false}

fixture:
  - role: assistant
    content: ""
    tool_calls:
      - name: ask_buddy
        arguments:
          question: "Rust CLI 项目的 logger 库偏好"
          context: "用户在选 logger 库，希望用之前的偏好"

expect:
  must_call_tool:
    - name: ask_buddy

  rubric:
    - criterion: >
        Agent called ask_buddy to delegate the preference decision.
      weight: critical
    - criterion: >
        Agent did NOT just ask the user back ("你想用哪个？") when
        ask_buddy is the documented escape hatch for routine prefs.
      weight: major
