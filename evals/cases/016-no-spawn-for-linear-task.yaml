id: 016-no-spawn-for-linear-task
category: tool-selection
rule: R10
description: |
  Don't spawn sub-agents for inherently linear work. A two-step
  "search then read" chain is sequential by nature — the URL to read
  comes from the search results — and should be done inline.

mode: fixture

user_message: "搜一下 Tauri 2.0 的官方 changelog 然后看看主要新特性。"

mock_tool_results:
  web_search: |
    Found 1 result:
    1. https://tauri.app/blog/tauri-20 — Tauri 2.0 Release
  browser_fetch: |
    Tauri 2.0 highlights: mobile target (iOS/Android), tray API rewrite, …

fixture:
  - role: assistant
    content: ""
    tool_calls:
      - name: web_search
        arguments: { query: "Tauri 2.0 changelog" }
  - role: assistant
    content: ""
    tool_calls:
      - name: browser_fetch
        arguments: { url: "https://tauri.app/blog/tauri-20" }

expect:
  must_call_tool:
    - name: web_search
    - name: browser_fetch
  must_not_call_tool:
    - name: spawn_agents

  rubric:
    - criterion: >
        Agent chained web_search → browser_fetch inline.
      weight: critical
    - criterion: >
        Agent did NOT spawn sub-agents for what is a 2-step linear
        pipeline.
      weight: critical
