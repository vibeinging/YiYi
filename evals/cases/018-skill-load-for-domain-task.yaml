id: 018-skill-load-for-domain-task
category: tool-selection
rule: R12
description: |
  Domain-shaped tasks (PDF, PPT, Word, Feishu, browser, canvas) should
  start with `activate_skills` to load the skill's tested SOP into the
  prompt, then run the steps. Skipping this often makes the agent
  invent its own (wrong) pipeline.

mode: fixture

user_message: "解析一下 ~/Documents/合同.pdf 里的关键条款"

mock_tool_results:
  activate_skills: |
    Loaded skill: pdf
    SOP: use pypdf via run_python_script. Code template at /skills/pdf/scripts/extract.py
  run_python_script: |
    Extracted text saved to /tmp/contract.txt (4521 chars)
  read_file: |
    第一条 服务期限：自 2026 年 5 月 1 日起... [contract excerpt]

fixture:
  - role: assistant
    content: "PDF 处理我先加载 skill。"
    tool_calls:
      - name: activate_skills
        arguments: { skills: ["pdf"] }

expect:
  must_call_tool:
    - name: activate_skills

  rubric:
    - criterion: >
        Agent called activate_skills with `pdf` (or similar PDF skill
        name) before attempting extraction.
      weight: critical
    - criterion: >
        Agent did NOT immediately shell out to `pdftotext` or invent
        a bespoke parsing pipeline without loading the skill first.
      weight: major
