id: 024-compact-context-flash-tool
category: tool-selection
rule: R10
description: |
  Compacting a long block of text or recent conversation should use
  `compact_context` — it's the Flash-driven cheap path designed for
  exactly this. Doing the compaction inline on Pro burns tokens.

mode: fixture

user_message: |
  把下面这段会议笔记压缩成 200 字以内的摘要，保留关键决定、负责人、数字和时间节点。
  原文很长，至少 4000 字，请用 compact_context 工具处理；不要直接在主对话里手写摘要。

  ===== 会议笔记 begin =====
  2026-04-15 周二 14:00-16:30 · Q2 产品规划会
  参会：张明（PM）、李华（Eng Lead）、王芳（Design）、赵勇（QA）、外部嘉宾陈博士

  议题 1：DeepSeek V4 适配进度（张明开场）
  - V4 Pro 已切流 100%，过去 7 天 P95 延迟 1.8s，比 V3.2 慢 12%，可接受
  - V4 Flash 路由覆盖率 78%（meditation/compaction/heartbeat 已切，subagent 未切）
  - 缓存命中率：本周 41%，目标 60%；李华下周对齐 prefix cache 优化
  - 月度成本 vs 上月：-32%（V4 Flash 价格优势 + 路由命中提升）
  决议：本周三完成 subagent 路由切流，赵勇协助回归测试
  AI：李华 · 截止：2026-04-17 EOD

  议题 2：浏览器自动化 lazy install 上线评估（王芳主持）
  - 方案 A（启动检查）vs 方案 B（按需触发）：用户调研 23 人均反对启动弹窗
  - 数据：beta 用户中 67% 从未触发浏览器需求，启动弹窗会让其中 92% 困惑
  - 决定：采用方案 B，预计本月底上线
  - 设计稿：王芳明天发 Figma，5 月 6 日定稿
  AI：王芳 · 截止：2026-04-22

  议题 3：成本告警阈值（赵勇报告）
  - 上周触发 3 次 daily cost > $50 告警，2 次为冥想批处理 spike，1 次为用户长任务
  - 提议：按用户分组告警，主对话单独阈值 $20，后台任务阈值 $30
  - 陈博士建议参考 LangSmith 的成本聚合分桶设计
  决议：本月加入"按 UsageSource 阈值"特性，GitHub issue #1842 跟踪
  AI：赵勇 · 截止：2026-04-30

  议题 4：第三方 MCP 接入（陈博士分享）
  - 当前已支持 Playwright MCP；calendar / email MCP 是下一阶段重点
  - 推荐 mcp-server-everything 做集成测试基线
  - 安全要点：MCP token 不能放纯文本配置，需要 OS keychain
  - 现实：用户在 #user-feedback 频道反复要求"对接 Notion"，优先级提升
  决议：5 月做 Notion MCP 试点，预算 30 工时
  AI：张明分配 owner · 截止：2026-04-25

  议题 5：DeepSeek V4 多模态时间表（外部信息）
  - 陈博士透露：V4 多模态预计 6 月发布预览版
  - 我们当前的 vision-disabled 工具一旦 V4 多模态可用即恢复
  - 工程上做好"flag 切换 + 一键恢复 4 个 vision 工具"准备
  决议：李华下周提交"vision feature gate"设计 RFC
  AI：李华 · 截止：2026-04-22 RFC

  议题 6：用户反馈整理（张明）
  Top 10 抱怨：
   1) 浏览器截图模型看不见（多模态后修） - 12 票
   2) 工具列表太长 agent 选错 - 9 票（已优化到 52 个）
   3) 提示词太长慢 - 7 票
   4) 没有"撤销上一步"按钮 - 6 票（side-git 已经支持，UI 缺失）
   5) DingTalk bot token 过期不提示 - 5 票
   6) skill 文档过期 - 5 票（PDF/DOCX/XLSX skill 已修）
   7) 中文 OCR 不准 - 4 票
   8) Memory 检索准确率 - 4 票
   9) 长文本压缩太慢 - 3 票
  10) Linux 启动失败 - 3 票
  决议：top 5 进入 Q2 路线图，赵勇负责跟进 #1842

  议题 7：预算确认
  - Q2 LLM 总预算：$28,000（V4 Pro $18k + V4 Flash $5k + 备份 $5k）
  - 同比 Q1 -38%（V4 价格优势）
  - 月度对账日：每月 5 日

  下次会议：2026-04-29 14:00 · 季度复盘
  ===== 会议笔记 end =====


mock_tool_results:
  compact_context: |
    {"summary":"<200-word distilled summary>","input_chars":21000,"output_chars":580,"compaction_ratio_pct":"2.8","model":"deepseek-v4-flash"}

fixture:
  - role: assistant
    content: "走 Flash 压缩。"
    tool_calls:
      - name: compact_context
        arguments:
          text: "[meeting transcript]"
          focus: "key decisions and numbers"
          max_words: 200

expect:
  must_call_tool:
    - name: compact_context

  rubric:
    - criterion: >
        Agent called compact_context (Flash-routed) instead of
        composing the summary inline (which would burn Pro tokens).
      weight: major
