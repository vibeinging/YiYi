id: 011-file-grep-typed-not-shell
category: tool-selection
rule: R9
description: |
  Pattern search across the project should use `grep_search`, not
  shelling out to `grep` / `rg`. The typed tool returns structured
  matches the agent can parse without re-shelling.

mode: fixture

user_message: "找一下代码里所有的 TODO 注释"

mock_tool_results:
  grep_search: |
    src/lib.rs:42:    // TODO: handle ENOENT
    src/agent.rs:118:  // TODO: switch to typed events

fixture:
  - role: assistant
    content: "搜一下。"
    tool_calls:
      - name: grep_search
        arguments: { pattern: "TODO" }

expect:
  must_call_tool:
    - name: grep_search
  must_not_call_tool:
    - name: execute_shell

  rubric:
    - criterion: >
        Agent used grep_search for the cross-file pattern lookup.
      weight: critical
    - criterion: >
        Agent did NOT shell out to grep / rg / ack.
      weight: critical
