id: 023-current-time-typed
category: tool-selection
rule: R9
description: |
  "现在几点 / 今天日期" → `get_current_time`, not shell `date`. Trivial
  case but a common shell-temptation footgun.

mode: fixture

user_message: "现在几点了？"

mock_tool_results:
  get_current_time: |
    2026-05-06 17:42:18 +08:00 (Asia/Shanghai)

fixture:
  - role: assistant
    content: ""
    tool_calls:
      - name: get_current_time
        arguments: {}

expect:
  must_call_tool:
    - name: get_current_time
  must_not_call_tool:
    - name: execute_shell

  rubric:
    - criterion: >
        Agent used get_current_time (typed).
      weight: critical
    - criterion: >
        Agent did NOT shell out to `date`.
      weight: minor
