id: 012-file-edit-typed-not-overwrite
category: tool-selection
rule: R9
description: |
  Modifying a small portion of a file should use `edit_file` (find +
  replace), not `write_file` (which overwrites the whole file from a
  re-supplied buffer that the agent has to reconstruct from memory —
  bug-prone). Also definitely not shell `sed`.

mode: fixture

user_message: "把 src/lib.rs 里的 v0.1.0 改成 v0.2.0"

mock_tool_results:
  edit_file: |
    Patched src/lib.rs (1 replacement).

fixture:
  - role: assistant
    content: ""
    tool_calls:
      - name: edit_file
        arguments:
          path: "src/lib.rs"
          old_text: "v0.1.0"
          new_text: "v0.2.0"

expect:
  must_call_tool:
    - name: edit_file
  must_not_call_tool:
    - name: write_file
    # NOTE: NOT forbidding execute_shell here — agent reasonably opens
    # the file with `cat` (or read_file) to verify content before
    # editing. The R9 concern is about mutation: edit_file gives undo,
    # `sed -i` doesn't.

  rubric:
    - criterion: >
        Agent used edit_file (with its undo support) for the targeted
        string replacement.
      weight: critical
    - criterion: >
        Agent did NOT use write_file (which would risk losing the rest
        of the file) or shell `sed -i` (no undo).
      weight: critical

