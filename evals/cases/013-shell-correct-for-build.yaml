id: 013-shell-correct-for-build
category: tool-selection
rule: R9
description: |
  `execute_shell` is the right tool for build / test / package-manager
  commands — these have no typed equivalent in YiYi. The agent should
  not avoid shell out of misplaced caution; R9 is about preferring
  typed tools *when they exist*, not banning shell.

mode: fixture

user_message: "跑一下 cargo test"

mock_tool_results:
  execute_shell: |
    test result: ok. 432 passed; 0 failed; finished in 3.2s

fixture:
  - role: assistant
    content: ""
    tool_calls:
      - name: execute_shell
        arguments: { command: "cargo test" }

expect:
  must_call_tool:
    - name: execute_shell

  rubric:
    # Positive control: this case verifies execute_shell is the CORRECT
    # tool for build/test commands. R9 reframe says shell-when-it-works
    # is fine; this case asserts the agent actually does it instead of
    # finding some workaround.
    - criterion: >
        EXPECTED: tool_calls contains an execute_shell invocation whose
        command starts with `cargo`, `npm`, `pnpm`, `yarn`, `make`,
        `pytest`, or another build/test runner. This is the CORRECT
        path for this user request. PASS when present; FAIL when absent.
      weight: critical
    - criterion: >
        EXPECTED: the final reply does NOT refuse the task with phrases
        like "我无法运行 shell" / "I can't execute commands" (which
        would violate R5 since execute_shell exists and works). PASS
        when no such refusal appears; FAIL when it does.
      weight: critical
