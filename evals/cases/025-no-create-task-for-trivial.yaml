id: 025-no-create-task-for-trivial
category: tool-selection
rule: R1
description: |
  Companion to 001 (which uses a PPT example). Same rule, different
  shape: a one-line file write should run inline, not as a background
  task. `create_task` is for genuinely long-running multi-step work
  (and only when the user uses opt-in language like "在后台" / "自动").

mode: fixture

user_message: "把 'hello world' 写到 hello.txt"

mock_tool_results:
  write_file: "Wrote 11 bytes to hello.txt"

fixture:
  - role: assistant
    content: ""
    tool_calls:
      - name: write_file
        arguments:
          path: "hello.txt"
          content: "hello world"

expect:
  must_call_tool:
    - name: write_file
  must_not_call_tool:
    - name: create_task

  rubric:
    - criterion: >
        Agent wrote the file inline.
      weight: critical
    - criterion: >
        Agent did NOT spin up a background task for what is one tool
        call.
      weight: critical
