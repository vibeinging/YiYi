id: 014-list-dir-typed-not-shell
category: tool-selection
rule: R9
description: |
  Listing a directory's contents → `list_directory` (typed, structured
  output), not shell `ls`. Same R9 principle as read/grep/edit.

mode: fixture

user_message: "看下当前目录有哪些文件"

mock_tool_results:
  list_directory: |
    README.md (file, 4.2KB)
    Cargo.toml (file, 0.8KB)
    src/ (dir)
    tests/ (dir)

fixture:
  - role: assistant
    content: ""
    tool_calls:
      - name: list_directory
        arguments: { path: "." }

expect:
  must_call_tool:
    - name: list_directory
  must_not_call_tool:
    - name: execute_shell

  rubric:
    - criterion: >
        Agent invoked list_directory for the directory listing.
      weight: critical
    - criterion: >
        Agent did NOT shell out to `ls` / `tree` for what is a typed-
        tool-supported operation.
      weight: critical
